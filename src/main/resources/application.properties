spring.application.name=Spring_Project

# Настройка H2 (в памяти или файловая)
spring.datasource.url=jdbc:h2:file:./data/is_lab;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.datasource.hikari.maximum-pool-size=10

# JWT
jwt.secret=${JWT_SECRET:my_super_secret_key_for_local_dev_only_1234567890}

# Уровень логов
logging.level.org.springframework.jdbc.core=DEBUG